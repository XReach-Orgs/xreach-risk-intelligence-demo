version: "3.9"

name: xreach-risk-intelligence

services:
  postgres:
    image: postgres:16-alpine
    container_name: xreach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xreach_risk
      POSTGRES_USER: xreach
      POSTGRES_PASSWORD: xreach_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U xreach -d xreach_risk" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xreach_net

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: xreach-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env.example
    environment:
      APP_NAME: XReach Risk Intelligence API
      ENVIRONMENT: development
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg2://xreach:xreach_dev_password@postgres:5432/xreach_risk
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: INFO
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: [ "/bin/sh", "/app/entrypoint.sh" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/live || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - xreach_net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: xreach-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - xreach_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: xreach-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - xreach_net

  grafana:
    image: grafana/grafana:11.1.4
    container_name: xreach-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - xreach_net

volumes:
  postgres_data:
  mlflow_data:
  grafana_data:


networks:
  xreach_net:
    driver: bridge
